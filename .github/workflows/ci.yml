name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  actions: write
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run repository unit tests
        run: python3 -m unittest discover -s .github/tests

      - name: Run delivered unit tests
        run: python3 -m unittest discover -s .github/aicodingflow-tests

      - name: Compile Python scripts
        run: |
          PYTHONPYCACHEPREFIX=/tmp/aicodingflow-pycache python3 -m py_compile \
            .github/scripts/*.py \
            .agents/skills/implement-specs/scripts/*.py \
            .agents/skills/review-pr/scripts/validate_review_json.py \
            .agents/skills/update-pr-review/scripts/*.py

  ai-review:
    needs: test
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Mark AI PR Review queued
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/$HEAD_SHA" \
            -f state="pending" \
            -f context="AI PR Review" \
            -f description="AI PR review is queued" \
            -f target_url="$RUN_URL"

      - name: Dispatch AI PR Review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh workflow run review-pr.yml --repo "${{ github.repository }}" -f pr_number="$PR_NUMBER"

      - name: Mark AI PR Review dispatch failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/$HEAD_SHA" \
            -f state="failure" \
            -f context="AI PR Review" \
            -f description="AI PR review dispatch failed" \
            -f target_url="$RUN_URL"
