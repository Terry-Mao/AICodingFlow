name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  actions: write
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install Python test dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/aicodingflow-venv"
          "$RUNNER_TEMP/aicodingflow-venv/bin/python" -m pip install \
            --disable-pip-version-check "PyYAML==6.0.3"
          echo "$RUNNER_TEMP/aicodingflow-venv/bin" >> "$GITHUB_PATH"

      - name: Run repository unit tests
        run: python3 -m unittest discover -s .github/tests

      - name: Run delivered unit tests
        run: python3 -m unittest discover -s .github/aicodingflow-tests

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          base_url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl --fail --silent --show-error --location "$base_url/$archive" --output "$RUNNER_TEMP/$archive"
          curl --fail --silent --show-error --location "$base_url/actionlint_${ACTIONLINT_VERSION}_checksums.txt" \
            --output "$RUNNER_TEMP/actionlint_checksums.txt"
          grep "  $archive$" "$RUNNER_TEMP/actionlint_checksums.txt" > "$RUNNER_TEMP/actionlint_checksum.txt"
          (cd "$RUNNER_TEMP" && sha256sum --check actionlint_checksum.txt)
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Lint GitHub Actions workflows
        run: |
          mapfile -d '' workflow_files < <(find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) -print0)
          if ((${#workflow_files[@]} == 0)); then
            echo "No GitHub Actions workflow files found" >&2
            exit 1
          fi
          actionlint "${workflow_files[@]}"

      - name: Compile Python scripts
        run: |
          PYTHONPYCACHEPREFIX=/tmp/aicodingflow-pycache python3 -m py_compile \
            .github/scripts/*.py \
            .github/skills/implement-specs/scripts/*.py \
            .github/skills/review-pr/scripts/validate_review_json.py \
            .github/skills/update-pr-review/scripts/*.py

  ai-review:
    needs: test
    if: >-
      needs.test.result == 'success' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Dispatch AI PR Review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh workflow run review-pr.yml --repo "${{ github.repository }}" -f pr_number="$PR_NUMBER"
