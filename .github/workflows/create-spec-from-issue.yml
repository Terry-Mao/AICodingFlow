name: Create Spec From Issue

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "GitHub issue number"
        required: true
      agent_login:
        description: "Agent login that can be assigned or mentioned; defaults to AGENT_LOGIN"
        required: false
        default: ""
  issues:
    types: [labeled, assigned]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: read
  pull-requests: write
  actions: write

concurrency:
  group: create-spec-from-issue-${{ inputs.issue || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  create-spec:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.issue.pull_request == null &&
        (
          (github.event_name == 'issue_comment' && (inputs.agent_login != '' || vars.AGENT_LOGIN != '') && contains(github.event.comment.body, format('@{0}', inputs.agent_login || vars.AGENT_LOGIN))) ||
          (github.event.action == 'labeled' && github.event.label.name == 'ready-to-spec' && contains(github.event.issue.assignees.*.login, inputs.agent_login || vars.AGENT_LOGIN)) ||
          (github.event.action == 'assigned' && github.event.assignee.login == (inputs.agent_login || vars.AGENT_LOGIN) && contains(github.event.issue.labels.*.name, 'ready-to-spec'))
        )
        &&
        contains(github.event.issue.labels.*.name, 'ready-to-spec')
        &&
        !contains(github.event.issue.labels.*.name, 'ready-to-implement')
      )
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Prepare issue context
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue || github.event.issue.number }}
          AGENT_LOGIN: ${{ inputs.agent_login || vars.AGENT_LOGIN }}
        run: |
          python3 .github/scripts/prepare_issue_spec_context.py \
            --repo "${{ github.repository }}" \
            --issue "$ISSUE_NUMBER" \
            --event-name "${{ github.event_name }}" \
            --event-path "$GITHUB_EVENT_PATH" \
            --agent-login "$AGENT_LOGIN" \
            --output issue_context.json \
            --comments-output issue_comments.txt \
            --github-output "$GITHUB_OUTPUT"

      - name: Stop when issue is not ready
        if: steps.issue.outputs.should_run != 'true'
        run: |
          echo "${{ steps.issue.outputs.skip_reason }}"

      - name: Install Codex sandbox prerequisites
        if: steps.issue.outputs.should_run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap

      - name: Configure Codex API endpoint
        if: steps.issue.outputs.should_run == 'true'
        id: codex_endpoint
        env:
          OPENAI_API_ENDPOINT: ${{ vars.OPENAI_API_ENDPOINT }}
        run: |
          endpoint="${OPENAI_API_ENDPOINT%/}"
          if [ -z "$endpoint" ]; then
            echo "OPENAI_API_ENDPOINT is not set" >&2
            exit 1
          fi
          case "$endpoint" in
            */responses) ;;
            *) endpoint="$endpoint/responses" ;;
          esac
          echo "url=$endpoint" >> "$GITHUB_OUTPUT"

      - name: Create specs
        if: steps.issue.outputs.should_run == 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          responses-api-endpoint: ${{ steps.codex_endpoint.outputs.url }}
          prompt: |
            Create GitHub issue specs from the stable local context files.

            Inputs:
            - issue_context.json
            - issue_comments.txt

            Read issue_context.json first. Then read and use these skills in
            this exact order:
            1. .agents/skills/spec-driven-implementation/SKILL.md
               - Overall workflow: decide and organize spec-first work.
            2. .agents/skills/write-product-spec/SKILL.md
               - General product spec writing rules.
            3. .agents/skills/create-product-spec/SKILL.md
               - GitHub issue wrapper for product specs.
            4. .agents/skills/write-tech-spec/SKILL.md
               - General tech spec writing rules.
            5. .agents/skills/create-tech-spec/SKILL.md
               - GitHub issue wrapper for tech specs.

            Required outputs:
            - ${{ steps.issue.outputs.product_spec }}
            - ${{ steps.issue.outputs.tech_spec }}
            - pr-metadata.json

            This workflow is only for writing specs. Produce product.md,
            tech.md, and pr-metadata.json only. Do not implement the feature,
            modify production code, or begin the implement-specs phase.

            Write product.md and tech.md in the primary natural language of
            the issue title, issue body, and explicit triggering comment.
            For example, use Chinese for primarily Chinese issues and English
            for primarily English issues. Keep code identifiers, file paths,
            labels, branch names, and API names unchanged.

            Write pr-metadata.json as a JSON object with:
            - branch_name: issue_context.json.target_branch
            - pr_title: concise conventional-commit style PR title, such as
              "docs(spec): create issue ${{ steps.issue.outputs.issue_number }} specs"
            - pr_summary: complete markdown PR body. It must include the exact
              non-closing issue reference "Refs #${{ steps.issue.outputs.issue_number }}".

            Respect issue_context.json.coauthor_directives in generated
            metadata or specs when relevant, but do not invent coauthors.

            Do not modify .agents, .github, tests, README, or production code.
            Do not run git commands, commit, push, create PRs, or call GitHub APIs.

      - name: Validate spec output
        if: steps.issue.outputs.should_run == 'true'
        run: python3 .github/scripts/validate_spec_output.py --context issue_context.json --metadata pr-metadata.json

      - name: Check for spec changes
        if: steps.issue.outputs.should_run == 'true'
        id: changes
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- "${{ steps.issue.outputs.product_spec }}" "${{ steps.issue.outputs.tech_spec }}")" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write PR metadata files
        if: steps.issue.outputs.should_run == 'true' && steps.changes.outputs.changed == 'true'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          metadata = json.loads(Path("pr-metadata.json").read_text(encoding="utf-8"))
          Path("pr-title.txt").write_text(metadata["pr_title"], encoding="utf-8")
          Path("pr-body.md").write_text(metadata["pr_summary"], encoding="utf-8")
          PY

      - name: Create or update spec pull request
        if: steps.issue.outputs.should_run == 'true' && steps.changes.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ steps.issue.outputs.target_branch }}
          DEFAULT_BRANCH: ${{ steps.issue.outputs.default_branch }}
          PRODUCT_SPEC: ${{ steps.issue.outputs.product_spec }}
          TECH_SPEC: ${{ steps.issue.outputs.tech_spec }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
        run: |
          branch="$TARGET_BRANCH"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Fetch the existing spec branch only to seed --force-with-lease.
          # The new spec branch is always recreated from the default branch.
          git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch" || true
          git fetch origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          git switch -C "$branch" "origin/$DEFAULT_BRANCH"
          git add "$PRODUCT_SPEC" "$TECH_SPEC"
          git commit -m "docs(spec): create issue $ISSUE_NUMBER specs"
          git push --force-with-lease origin "$branch"

          title="$(cat pr-title.txt)"
          body="$(cat pr-body.md)"
          pr_number="$(gh pr list \
            --repo "${{ github.repository }}" \
            --head "$branch" \
            --state open \
            --json number \
            --jq '.[0].number // ""')"

          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" \
              --repo "${{ github.repository }}" \
              --title "$title" \
              --body "$body"
          else
            gh pr create \
              --repo "${{ github.repository }}" \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$branch" \
              --title "$title" \
              --body "$body"
            pr_number="$(gh pr list \
              --repo "${{ github.repository }}" \
              --head "$branch" \
              --state open \
              --json number \
              --jq '.[0].number // ""')"
          fi
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Dispatch AI PR review
        if: steps.issue.outputs.should_run == 'true' && steps.changes.outputs.changed == 'true' && steps.pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          gh workflow run review-pr.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.event.repository.default_branch }}" \
            -f pr_number="$PR_NUMBER"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: create-spec-from-issue-${{ github.run_id }}
          path: |
            issue_context.json
            issue_comments.txt
            pr-metadata.json
            pr-title.txt
            pr-body.md
