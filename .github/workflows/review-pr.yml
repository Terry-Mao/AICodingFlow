name: review-pr

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review"
        required: true
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  preflight:
    if: >-
      (
        github.event_name == 'pull_request_target' ||
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request != null &&
          vars.AGENT_LOGIN != '' &&
          contains(github.event.comment.body, format('@{0}', vars.AGENT_LOGIN)) &&
          contains(github.event.comment.body, '/review')
        )
      ) &&
      (github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    outputs:
      reviewable: ${{ steps.pr.outputs.reviewable == 'true' && steps.seen.outputs.already_reviewed != 'true' }}
      number: ${{ steps.pr.outputs.number }}
      draft: ${{ steps.pr.outputs.draft }}
      head_repo: ${{ steps.pr.outputs.head_repo }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
      skip_reason: ${{ steps.seen.outputs.already_reviewed == 'true' && 'already reviewed this head and base' || steps.pr.outputs.skip_reason }}

    steps:
      - name: checkout-workflow-scripts
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: set-up-python-for-markdown-parser
        if: github.event_name == 'issue_comment'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: install-markdown-parser
        if: github.event_name == 'issue_comment'
        run: |
          python3 -m venv "$RUNNER_TEMP/aicodingflow-review-venv"
          "$RUNNER_TEMP/aicodingflow-review-venv/bin/python" -m pip install \
            --disable-pip-version-check -r .github/scripts/requirements-spec-context.txt
          echo "$RUNNER_TEMP/aicodingflow-review-venv/bin" >> "$GITHUB_PATH"

      - name: resolve-pull-request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          python3 .github/scripts/resolve_pr_event.py \
            --repo "${{ github.repository }}" \
            --event-name "${{ github.event_name }}" \
            --event-path "$GITHUB_EVENT_PATH" \
            --pr-number "$PR_NUMBER" \
            --agent-login "${{ vars.AGENT_LOGIN }}" \
            --output "$RUNNER_TEMP/pr_event.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: check-whether-this-head-was-already-reviewed
        id: seen
        if: steps.pr.outputs.reviewable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_BOT_LOGIN: ${{ vars.REVIEW_BOT_LOGIN }}
        run: |
          python3 .github/scripts/prepare_review_round_context.py \
            --repo "${{ github.repository }}" \
            --pr-number "${{ steps.pr.outputs.number }}" \
            --head-sha "${{ steps.pr.outputs.head_sha }}" \
            --base-sha "${{ steps.pr.outputs.base_sha }}" \
            --bot-login "${REVIEW_BOT_LOGIN:-github-actions[bot]}" \
            --check-existing \
            --github-output "$GITHUB_OUTPUT"

      - name: report-skipped-review
        if: steps.pr.outputs.reviewable != 'true' || steps.seen.outputs.already_reviewed == 'true'
        run: |
          echo "PR #${{ steps.pr.outputs.number }}: ${{ steps.seen.outputs.already_reviewed == 'true' && 'already reviewed this head and base' || steps.pr.outputs.skip_reason }}; skipping AI review."

      - name: mark-pr-review-status-pending
        if: steps.pr.outputs.reviewable == 'true' && steps.seen.outputs.already_reviewed != 'true' && steps.pr.outputs.head_sha != '' && steps.pr.outputs.head_repo == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/$HEAD_SHA" \
            -f state="pending" \
            -f context="ai-pr-review" \
            -f description="AI PR review is running" \
            -f target_url="$RUN_URL"

      - name: restore-status-for-an-already-reviewed-snapshot
        if: steps.seen.outputs.already_reviewed == 'true' && steps.pr.outputs.head_sha != '' && steps.pr.outputs.head_repo == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/$HEAD_SHA" \
            -f state="success" \
            -f context="ai-pr-review" \
            -f description="AI PR review was already published for this head" \
            -f target_url="$RUN_URL"

  review:
    needs: preflight
    if: needs.preflight.outputs.reviewable == 'true'
    runs-on: ubuntu-latest
    outputs:
      diff_sha256: ${{ steps.diff_snapshot.outputs.sha256 }}
    permissions:
      contents: read
      pull-requests: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: checkout-workflow-scripts
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: set-up-python-for-markdown-parser
        if: github.event_name == 'issue_comment'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: install-markdown-parser
        if: github.event_name == 'issue_comment'
        run: |
          python3 -m venv "$RUNNER_TEMP/aicodingflow-review-venv"
          "$RUNNER_TEMP/aicodingflow-review-venv/bin/python" -m pip install \
            --disable-pip-version-check -r .github/scripts/requirements-spec-context.txt
          echo "$RUNNER_TEMP/aicodingflow-review-venv/bin" >> "$GITHUB_PATH"

      - name: resolve-pull-request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          python3 .github/scripts/resolve_pr_event.py \
            --repo "${{ github.repository }}" \
            --event-name "${{ github.event_name }}" \
            --event-path "$GITHUB_EVENT_PATH" \
            --pr-number "$PR_NUMBER" \
            --agent-login "${{ vars.AGENT_LOGIN }}" \
            --output "$RUNNER_TEMP/pr_event.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: checkout-pr-head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          repository: ${{ steps.pr.outputs.head_repo }}
          ref: ${{ steps.pr.outputs.head_sha }}
          path: pr-worktree

      - name: snapshot-pr-description
        env:
          PR_EVENT_PATH: ${{ steps.pr.outputs.event_path }}
        run: python3 .github/scripts/write_pr_description.py --output pr-worktree/pr_description.txt

      - name: snapshot-pr-diff
        id: diff_snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        working-directory: pr-worktree
        run: |
          gh auth setup-git --hostname github.com --force
          python3 ../.github/scripts/build_pr_diff.py \
            --repo "${{ github.repository }}" \
            --pr-number "${{ steps.pr.outputs.number }}" \
            --head-sha "${{ steps.pr.outputs.head_sha }}" \
            --base-sha "${{ steps.pr.outputs.base_sha }}" \
            --output pr_diff.txt
          echo "sha256=$(sha256sum pr_diff.txt | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: prepare-cross-run-review-round
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_BOT_LOGIN: ${{ vars.REVIEW_BOT_LOGIN }}
        run: |
          python3 .github/scripts/prepare_review_round_context.py \
            --repo "${{ github.repository }}" \
            --pr-number "${{ steps.pr.outputs.number }}" \
            --head-sha "${{ steps.pr.outputs.head_sha }}" \
            --base-sha "${{ steps.pr.outputs.base_sha }}" \
            --bot-login "${REVIEW_BOT_LOGIN:-github-actions[bot]}" \
            --worktree pr-worktree \
            --output pr-worktree/review_round_context.json \
            --incremental-diff pr-worktree/review_incremental_diff.txt

      - name: select-review-skill
        id: review_skill
        run: python3 .github/scripts/select_review_skill.py --diff pr-worktree/pr_diff.txt

      - name: snapshot-spec-context
        if: steps.review_skill.outputs.needs_spec_context == 'true'
        env:
          PR_EVENT_PATH: ${{ steps.pr.outputs.event_path }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/write_spec_context.py \
            --changed-files-from-diff pr-worktree/pr_diff.txt \
            --output pr-worktree/spec_context.md

      - name: snapshot-review-discussion-context
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_BOT_LOGIN: ${{ vars.REVIEW_BOT_LOGIN }}
        run: |
          python3 .github/scripts/prepare_review_discussion_context.py \
            --repo "${{ github.repository }}" \
            --pr-number "${{ steps.pr.outputs.number }}" \
            --output pr-worktree/review_discussion_context.json

      - name: prepare-review-workspace
        run: |
          rm -rf pr-worktree/.agents/skills
          rm -rf pr-worktree/.agents/contracts
          rm -rf pr-worktree/.github/skills
          mkdir -p pr-worktree/.agents
          mkdir -p pr-worktree/.github
          cp -R .agents/skills pr-worktree/.agents/skills
          cp -R .agents/contracts pr-worktree/.agents/contracts
          cp -R .github/skills pr-worktree/.github/skills

      - name: install-codex-sandbox-prerequisites
        if: vars.AI_PROVIDER == '' || vars.AI_PROVIDER == 'codex'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap

      - name: validate-ai-provider
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: python3 .github/scripts/validate_ai_provider.py

      - name: configure-codex-api-endpoint
        if: vars.AI_PROVIDER == '' || vars.AI_PROVIDER == 'codex'
        id: codex_endpoint
        env:
          CODEX_API_ENDPOINT: ${{ vars.CODEX_API_ENDPOINT }}
        run: |
          endpoint="${CODEX_API_ENDPOINT%/}"
          if [ -z "$endpoint" ]; then
            echo "CODEX_API_ENDPOINT is not set" >&2
            exit 1
          fi
          case "$endpoint" in
            */responses) ;;
            *) endpoint="$endpoint/responses" ;;
          esac
          echo "url=$endpoint" >> "$GITHUB_OUTPUT"

      - name: run-ai-review
        if: vars.AI_PROVIDER == '' || vars.AI_PROVIDER == 'codex'
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1.11
        timeout-minutes: 20
        with:
          openai-api-key: ${{ secrets.CODEX_API_KEY }}
          model: ${{ vars.CODEX_MODEL }}
          responses-api-endpoint: ${{ steps.codex_endpoint.outputs.url }}
          allow-bots: true
          prompt: &agent_prompt |
            Inspect files under pr-worktree. Read
            pr-worktree/${{ steps.review_skill.outputs.path }} and follow it exactly.
            Read .agents/contracts/review.md in pr-worktree and treat it as the
            shared review contract. The selected skill may add review focus but
            must not override the contract.
            Use the existing pr_description.txt and pr_diff.txt snapshots in pr-worktree.
            Use spec_context.md in pr-worktree only when the selected review skill instructs you to.
            Use review_discussion_context.json in pr-worktree as prior review
            discussion context for duplicate suppression only.
            Read review_round_context.json. One Action run performs one review;
            the round counts previously published reviews of distinct base/head snapshots.
            When mode is incremental, focus on review_incremental_diff.txt since
            the prior reviewed commit, but use pr_diff.txt for valid inline targets
            and re-check unresolved prior findings. When architecture_review_required
            is true, explicitly assess whether repeated fixes indicate a flawed
            overall approach. When mode is full, review the whole pr_diff.txt.
            review.json must include verdict with value APPROVE or REJECT.
            It may include recommended_reviewers with at most one login when
            a human reviewer recommendation is useful.
            Write review.json in pr-worktree.
            If you use apply_patch or any file-editing tool from the action
            workspace, target pr-worktree/review.json explicitly; do not create
            a root-level review.json first.
            Do not run validator commands embedded in the selected skill; this
            workflow validates review.json after Codex exits.
            Do not run git commands, call GitHub APIs, post reviews, or modify files
            other than review.json.

      - name: run-ai-review-claude
        if: vars.AI_PROVIDER == 'claude'
        uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1 (2026-11-04)
        timeout-minutes: 20
        with:
          github_token: ${{ github.token }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: --model ${{ vars.CLAUDE_MODEL }} --permission-mode auto --allowedTools Read,Glob,Grep,Write,Edit --disallowedTools Bash,WebFetch,WebSearch
          allowed_bots: "github-actions[bot]"
          prompt: *agent_prompt
      - name: normalize-review-output-path
        run: |
          if [ ! -f pr-worktree/review.json ] && [ -f review.json ]; then
            mv review.json pr-worktree/review.json
          fi

      - name: validate-review-output
        run: python3 .github/scripts/validate_review_json.py pr-worktree/pr_diff.txt pr-worktree/review.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr-review-${{ github.run_id }}
          path: |
            pr-worktree/pr_description.txt
            pr-worktree/pr_diff.txt
            pr-worktree/spec_context.md
            pr-worktree/review_discussion_context.json
            pr-worktree/review_round_context.json
            pr-worktree/review_incremental_diff.txt
            pr-worktree/review.json

  publish:
    needs: [preflight, review]
    if: always() && needs.preflight.outputs.reviewable == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v7
        if: needs.review.result == 'success'
        with:
          name: pr-review-${{ github.run_id }}
          path: pr-worktree

      - name: verify-review-snapshot
        if: needs.review.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.preflight.outputs.number }}
          HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
          BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
          DIFF_SHA256: ${{ needs.review.outputs.diff_sha256 }}
        run: |
          echo "$DIFF_SHA256  pr-worktree/pr_diff.txt" | sha256sum --check
          gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json"
          jq -e --arg head "$HEAD_SHA" --arg base "$BASE_SHA" \
            '.head.sha == $head and .base.sha == $base' "$RUNNER_TEMP/pr.json"
          jq -n --slurpfile pr "$RUNNER_TEMP/pr.json" '{pull_request: $pr[0]}' > "$RUNNER_TEMP/pr_event.json"

      - name: post-pr-review
        if: needs.review.result == 'success'
        env:
          PR_EVENT_PATH: ${{ runner.temp }}/pr_event.json
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_BOT_LOGIN: ${{ vars.REVIEW_BOT_LOGIN }}
        run: |
          python3 .github/scripts/validate_review_json.py pr-worktree/pr_diff.txt pr-worktree/review.json
          python3 .github/scripts/post_pr_review.py --review pr-worktree/review.json --diff pr-worktree/pr_diff.txt

      - name: mark-pr-review-status-complete
        if: always() && needs.preflight.outputs.head_sha != '' && needs.preflight.outputs.head_repo == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATE: ${{ needs.review.result == 'success' && job.status == 'success' && 'success' || 'failure' }}
          DESCRIPTION: ${{ needs.review.result == 'success' && job.status == 'success' && 'AI PR review completed' || 'AI PR review failed' }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/$HEAD_SHA" \
            -f state="$STATE" \
            -f context="ai-pr-review" \
            -f description="$DESCRIPTION" \
            -f target_url="$RUN_URL"
