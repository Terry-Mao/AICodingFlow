name: AI PR Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review"
        required: true
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          python3 .github/scripts/resolve_pr_event.py \
            --repo "${{ github.repository }}" \
            --event-name "${{ github.event_name }}" \
            --event-path "$GITHUB_EVENT_PATH" \
            --pr-number "$PR_NUMBER" \
            --output "$RUNNER_TEMP/pr_event.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Stop when PR is not reviewable
        if: steps.pr.outputs.reviewable != 'true'
        run: echo "PR #${{ steps.pr.outputs.number }} is draft or from another repository; skipping AI review."

      - name: Checkout PR head
        uses: actions/checkout@v4
        if: steps.pr.outputs.reviewable == 'true'
        with:
          fetch-depth: 0
          ref: ${{ steps.pr.outputs.head_sha }}

      - name: Snapshot PR description
        if: steps.pr.outputs.reviewable == 'true'
        env:
          GITHUB_EVENT_PATH: ${{ steps.pr.outputs.event_path }}
        run: python3 .github/scripts/write_pr_description.py --output pr_description.txt

      - name: Snapshot PR diff
        if: steps.pr.outputs.reviewable == 'true'
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          python3 .github/scripts/build_pr_diff.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --output pr_diff.txt

      - name: Select review skill
        if: steps.pr.outputs.reviewable == 'true'
        id: review_skill
        run: python3 .github/scripts/select_review_skill.py --diff pr_diff.txt

      - name: Snapshot spec context
        if: steps.pr.outputs.reviewable == 'true' && steps.review_skill.outputs.needs_spec_context == 'true'
        env:
          GITHUB_EVENT_PATH: ${{ steps.pr.outputs.event_path }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/write_spec_context.py --output spec_context.md

      - name: Install Codex sandbox prerequisites
        if: steps.pr.outputs.reviewable == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap

      - name: Configure Codex API endpoint
        if: steps.pr.outputs.reviewable == 'true'
        id: codex_endpoint
        env:
          OPENAI_API_ENDPOINT: ${{ vars.OPENAI_API_ENDPOINT }}
        run: |
          endpoint="${OPENAI_API_ENDPOINT%/}"
          if [ -z "$endpoint" ]; then
            echo "OPENAI_API_ENDPOINT is not set" >&2
            exit 1
          fi
          case "$endpoint" in
            */responses) ;;
            *) endpoint="$endpoint/responses" ;;
          esac
          echo "url=$endpoint" >> "$GITHUB_OUTPUT"

      - name: Run AI review
        if: steps.pr.outputs.reviewable == 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          responses-api-endpoint: ${{ steps.codex_endpoint.outputs.url }}
          prompt: |
            Read ${{ steps.review_skill.outputs.path }} and follow it exactly.
            Use the existing pr_description.txt and pr_diff.txt snapshots.
            Use spec_context.md only when the selected review skill instructs you to.
            Write review.json in the repository root.
            Do not run git commands, call GitHub APIs, post reviews, or modify files
            other than review.json.

      - name: Validate review output
        if: steps.pr.outputs.reviewable == 'true'
        run: python3 .agents/skills/review-pr/scripts/validate_review_json.py pr_diff.txt review.json

      - name: Post PR review
        if: steps.pr.outputs.reviewable == 'true'
        env:
          GITHUB_EVENT_PATH: ${{ steps.pr.outputs.event_path }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/post_pr_review.py --review review.json

      - uses: actions/upload-artifact@v4
        if: always() && steps.pr.outputs.reviewable == 'true'
        with:
          name: pr-review-${{ github.run_id }}
          path: |
            pr_description.txt
            pr_diff.txt
            spec_context.md
            review.json
